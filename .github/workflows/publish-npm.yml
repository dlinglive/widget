name: publish-npm
# main 에 package.json version 이 바뀌어 올라오면 npm 에 배포한다. 이미 있는 version 이면 건너뛴다.
# npm trusted publishing(OIDC)이라 토큰이 없고, provenance 가 자동으로 붙는다: https://docs.npmjs.com/trusted-publishers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-npm
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.repository == 'dlinglive/widget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci && pnpm test && pnpm build
      - id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@dlinglive/widget@$v" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@dlinglive/widget@$v already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # trusted publishing 은 npm CLI 11.5.1 이상이 필요하다.
      - if: steps.ver.outputs.skip == 'false'
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public
